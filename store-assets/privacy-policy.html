<script>
  // Send visitors to the policy in their browser language; the links below stay as a fallback.
  (function () {
    var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']
    for (var i = 0; i < langs.length; i++) {
      var l = String(langs[i]).toLowerCase()
      if (/^zh-(tw|hk|mo|hant)/.test(l)) return location.replace('privacy-policy.zh-TW.html')
      if (/^zh/.test(l)) return location.replace('privacy-policy.zh-CN.html')
      if (/^en/.test(l)) return location.replace('privacy-policy.en.html')
    }
    location.replace('privacy-policy.en.html')
  })()
</script>
